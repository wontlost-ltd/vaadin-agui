name: Publish to Maven Central

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0) - must match pom.xml"
        type: string
        required: true
      draft:
        description: "Create GitHub release as draft"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read

jobs:
  # 发布门禁：Maven Central 不可撤回，先确认该 commit 在 main 上且 CI 为绿。
  verify-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assert commit is on main
        run: |
          set -euo pipefail
          git fetch origin main --depth=0 2>/dev/null || git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA is not an ancestor of origin/main — refusing to publish."
            exit 1
          fi

      - name: Assert CI passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # tag push 与 CI 几乎同时触发，轮询直到 CI 完成；只看最近一次已完成的结论。
          for i in $(seq 1 60); do
            RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | {status, conclusion, run_number}]')
            PENDING=$(echo "$RUNS" | jq '[.[] | select(.status != "completed")] | length')
            LATEST=$(echo "$RUNS" | jq -r '[.[] | select(.status == "completed")] | sort_by(.run_number) | last | .conclusion // "none"')
            echo "attempt $i: pending=$PENDING latest_completed=$LATEST"
            if [[ "$PENDING" -eq 0 ]]; then
              if [[ "$LATEST" == "success" ]]; then
                exit 0
              fi
              if [[ "$LATEST" != "none" ]]; then
                echo "::error::Latest CI run for $GITHUB_SHA concluded '$LATEST' — refusing to publish."
                exit 1
              fi
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for CI to complete on $GITHUB_SHA."
          exit 1

  publish:
    needs: verify-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION}"
            TAG_NAME="v${VERSION}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${TAG_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version format: '$VERSION'."
            exit 1
          fi
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "$POM_VERSION" != "$VERSION" ]]; then
            echo "::error::pom.xml version ($POM_VERSION) does not match release version ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish to Maven Central
        run: mvn -B -ntp clean deploy -Prelease
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: v${{ steps.version.outputs.version }}
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          files: |
            target/agui-vaadin-${{ steps.version.outputs.version }}.jar
            target/agui-vaadin-${{ steps.version.outputs.version }}-sources.jar
            target/agui-vaadin-${{ steps.version.outputs.version }}-javadoc.jar
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
