name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Typecheck frontend
        working-directory: src/main/resources/META-INF/frontend/agui-vaadin
        run: npm ci && npm run typecheck
      - name: Build and test
        run: mvn -B -ntp clean verify

  # E2E 独立成 job：要先把示例应用打成生产包，比库本体慢得多，与 build 并行。
