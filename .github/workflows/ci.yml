name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Typecheck frontend
        working-directory: src/main/resources/META-INF/frontend/agui-vaadin
        run: npm ci && npm run typecheck
      - name: Build and test
        run: mvn -B -ntp clean verify

  # E2E 独立成 job：要先把示例应用打成生产包，比库本体慢得多，与 build 并行。
  e2e:
    name: E2E (Chromium + Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Install library
        run: mvn -B -ntp install -DskipTests
      - name: Build demo (production)
        run: mvn -B -ntp -f examples/agui-starter/pom.xml package -Pproduction -DskipTests
      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium firefox
      - name: Run E2E
        working-directory: e2e
        run: npm test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
